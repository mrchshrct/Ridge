[package]
name = "ridge"
version = "0.1.0"
description = "A notch-style productivity panel for Windows"
edition = "2021"

[lib]
name = "ridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "lib.rs"

[[bin]]
name = "ridge"
path = "main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-drag = "2.1.1"
tauri-plugin-updater = "2.10"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"

# WinRT media session access (System Media Transport Controls).
# There is no "WinRT" cargo feature in the `windows` crate: WinRT types are
# enabled per namespace, so we list the namespaces we touch.
[target.'cfg(windows)'.dependencies]
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Foundation_Collections",
  "Media_Control",
  "Storage_Streams",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_WinRT",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
