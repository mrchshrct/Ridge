name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release tag
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargoVersion = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne "v$version") {
            throw "Release tag $tag does not match app version $version."
          }
          if ($cargoVersion -ne $version -or $packageVersion -ne $version) {
            throw "Release versions must match: tauri=$version, cargo=$cargoVersion, package=$packageVersion."
          }

      - name: Run Rust checks
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify signing key is configured
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Configure TAURI_SIGNING_PRIVATE_KEY in repository Actions secrets."
          }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Build signed installers
        run: npm run tauri -- build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Prepare release assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart("v")
          $assets = "release-assets"
          New-Item -ItemType Directory -Force -Path $assets | Out-Null

          $updateBundle = Get-ChildItem "target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if ($null -eq $updateBundle) {
            throw "NSIS updater installer was not generated."
          }

          $signaturePath = "$($updateBundle.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Updater signature was not generated."
          }

          Copy-Item $updateBundle.FullName "$assets\Ridge-update.exe"
          Copy-Item $signaturePath "$assets\Ridge-update.exe.sig"

          Get-ChildItem "target\release\bundle\nsis\*.exe" | Copy-Item -Destination $assets
          Get-ChildItem "target\release\bundle\msi\*.msi" | Copy-Item -Destination $assets

          $manifest = @{
            version = $version
            notes = "Ridge $version"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = (Get-Content $signaturePath -Raw).Trim()
                url = "https://github.com/mrchshrct/Ridge/releases/download/$tag/Ridge-update.exe"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "$assets\latest.json" -Encoding utf8NoBOM

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
